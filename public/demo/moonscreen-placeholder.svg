<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240711"/>
      <stop offset="100%" stop-color="#3C0C1C"/>
    </linearGradient>
    <linearGradient id="stick_moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1828"/>
      <stop offset="50%" stop-color="#3C0C1C"/>
      <stop offset="100%" stop-color="#2B0612"/>
    </linearGradient>
    <linearGradient id="cap_moon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE6A9"/>
      <stop offset="100%" stop-color="#FFD77A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg_moon)"/>

  <!-- Starry Constellation Ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#FFE6A9" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.4"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="#FFE6A9" stroke-width="1" opacity="0.3"/>

  <!-- Crescent Moon Badge -->
  <path d="M 195 72 A 20 20 0 1 0 215 108 A 24 24 0 0 1 195 72 Z" fill="#FFE6A9" opacity="0.95"/>

  <!-- Stick Product Body -->
  <g transform="translate(155, 120)">
    <!-- Main Stick Body -->
    <rect x="0" y="50" width="90" height="150" rx="14" fill="url(#stick_moon)" stroke="#FFE6A9" stroke-width="2.5"/>
    <!-- Stick Base Dial -->
    <rect x="5" y="180" width="80" height="18" rx="6" fill="#FFE6A9"/>
    <line x1="20" y1="189" x2="70" y2="189" stroke="#3C0C1C" stroke-width="2"/>
    <!-- Stick Cap (Slid up slightly for aesthetic) -->
    <rect x="2" y="10" width="86" height="70" rx="12" fill="url(#cap_moon)" stroke="#FFF8E7" stroke-width="1.5"/>
    <text x="45" y="52" fill="#3C0C1C" font-family="serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">SKIPD</text>
    <!-- Label on body -->
    <text x="45" y="130" fill="#FFE6A9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MOONSCREEN</text>
    <text x="45" y="148" fill="#FFE6A9" font-family="sans-serif" font-size="9" text-anchor="middle" opacity="0.9">OVERNIGHT RECOVERY</text>
    <text x="45" y="162" fill="#FFE6A9" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.75">BARRIER BALM</text>
  </g>

  <!-- Product Tag and Disclaimer -->
  <rect x="40" y="330" width="320" height="42" rx="10" fill="#FFF8E7" stroke="#FFE6A9" stroke-width="1.2" opacity="0.95"/>
  <text x="200" y="348" fill="#3C0C1C" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Moonscreen · ₹1,500</text>
  <text x="200" y="362" fill="#6B3444" font-family="sans-serif" font-size="9" text-anchor="middle">DEMO PLACEHOLDER · FOR DEVELOPMENT TESTING ONLY</text>
</svg>
